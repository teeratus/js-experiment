<!DOCTYPE html>
<html>
<body>

<h2>JavaScript While Loop</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>The Do While Loop</h4>
<p id="demo"></p>

<script>
let text = "";
let i = 0;
do {
  text += "Number: " + i + "<br>";
  i++;
}
while (i < 5);
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
