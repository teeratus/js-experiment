<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Object Display</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Using Object.values()</h4>
<p id="demo"></p>

<script>
const person = {
  name: "John",
  age: 30,
  city: "New York"
};

const values = Object.values(person);
document.getElementById("demo").innerHTML =
  "Object.values(): " + values;
</script>

</body>
</html>
