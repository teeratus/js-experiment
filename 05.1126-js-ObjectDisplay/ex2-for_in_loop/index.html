<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Object Display</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Using a For .. In Loop</h4>
<p id="demo"></p>

<script>
const person = {
  name: "John",
  age: 30,
  city: "New York",
  country: "USA"
};

let text = "";
for (let key in person) {
  text += key + ": " + person[key] + "<br>";
}
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
