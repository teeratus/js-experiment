<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Objects</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Object Literals</h4>
<p id="demo"></p>

<script>
const person = {
  firstName: "John",
  lastName: "Doe",
  age: 30,
  eyeColor: "blue"
};

document.getElementById("demo").innerHTML =
  person.firstName + " " + person.lastName + ", age " + person.age + ", " + person.eyeColor + " eyes";
</script>

</body>
</html>
