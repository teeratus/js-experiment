<!DOCTYPE html>

<h2>JavaScript Comparisons</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>String Comparison</h4>
<p id="demo"></p>

<script>
let text1 = "A";
let text2 = "B";
let result = text1 < text2;
document.getElementById("demo").innerHTML =
  "A < B : " + result + "<br><br>" +
  "\"Apple\" < \"Banana\" : " + ("Apple" < "Banana") + "<br>" +
  "\"John\" > \"Jane\" : " + ("John" > "Jane");
</script>

</body>
</html>
