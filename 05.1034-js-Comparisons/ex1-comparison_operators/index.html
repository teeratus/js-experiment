<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Comparisons</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Comparison Operators</h4>
<p id="demo"></p>

<script>
let x = 5;
document.getElementById("demo").innerHTML =
  "x = " + x + "<br><br>" +
  "x == 8 : " + (x == 8) + "<br>" +
  "x == 5 : " + (x == 5) + "<br>" +
  "x == '5' : " + (x == "5") + "<br>" +
  "x === 5 : " + (x === 5) + "<br>" +
  "x === '5' : " + (x === "5") + "<br>" +
  "x != 8 : " + (x != 8) + "<br>" +
  "x > 8 : " + (x > 8) + "<br>" +
  "x < 8 : " + (x < 8) + "<br>" +
  "x >= 8 : " + (x >= 8) + "<br>" +
  "x <= 8 : " + (x <= 8);
</script>

</body>
</html>
