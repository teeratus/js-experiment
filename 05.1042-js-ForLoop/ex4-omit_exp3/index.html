<!DOCTYPE html>
<html>
<body>

<h2>JavaScript For Loop</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>How to use exp 3</h4>
<p id="demo"></p>

<script>
let text = "";
let i = 0;
for (; i < 5; ) {
  text += "Number: " + i + "<br>";
  i++;
}
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
