<!DOCTYPE html>
<html>
<body>

<h2>JavaScript For Loop</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>How to use exp 1</h4>
<p id="demo"></p>

<script>
let i = 0;
let text = "";
for (; i < 5; i++) {
  text += "Number: " + i + "<br>";
}
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
