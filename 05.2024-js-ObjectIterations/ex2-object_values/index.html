<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Object Iterations</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Object.values()</h4>
<p id="demo"></p>

<script>
const person = {
  firstName: "John",
  lastName: "Doe",
  age: 30
};

const values = Object.values(person);
document.getElementById("demo").innerHTML = "Values: " + values;
</script>

</body>
</html>
