<h2>JavaScript Arithmetic</h2>

<h4>Remainder (Modulus)</h4>
<p id="demo"></p>

<script>
let a = 17;
let b = 5;
let x = a % b;
document.getElementById("demo").innerHTML = "a % b = " + x + " (remainder of " + a + " / " + b + ")";
</script>
