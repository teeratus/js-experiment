<h2>JavaScript Arithmetic</h2>

<h4>Operator Precedence</h4>
<p id="demo1"></p>
<p id="demo2"></p>
<p id="demo3"></p>

<script>
document.getElementById("demo1").innerHTML = "100 + 50 * 3 = " + (100 + 50 * 3);
document.getElementById("demo2").innerHTML = "(100 + 50) * 3 = " + ((100 + 50) * 3);

</script>
