<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Looping</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>The do...while Loop</h4>
<p id="demo"></p>

<script>
let i = 0;
let text = "";
do {
  text += "Number: " + i + "<br>";
  i++;
} while (i < 5);
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
