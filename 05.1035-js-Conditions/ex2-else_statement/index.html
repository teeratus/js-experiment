<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Conditions</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>The else Statement</h4>
<p id="demo"></p>

<script>
let hour = 20;
if (hour < 18) {
  document.getElementById("demo").innerHTML = "Good day!";
} else {
  document.getElementById("demo").innerHTML = "Good evening!";
}
</script>
