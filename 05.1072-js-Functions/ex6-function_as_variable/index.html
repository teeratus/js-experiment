<h4>Functions Used as Variables</h4>
<p id="demo"></p>

<script>
function myFunction(a, b) {
  return a * b;
}
// Function result used directly as a variable
document.getElementById("demo").innerHTML = "5 * 3 = " + myFunction(5, 3);
</script>
