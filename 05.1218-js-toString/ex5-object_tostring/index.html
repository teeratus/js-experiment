<!DOCTYPE html>
<html>
<body>

<h2>JavaScript toString()</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Object toString()</h4>
<p id="demo"></p>

<script>
let person = {
  firstname: "John",
  lastname: "Doe",
}

let text = person.toString();

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
