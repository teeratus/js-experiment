<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Random</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Math.random()</h4>
<p id="demo"></p>

<script>
let text = "Random numbers between 0 and 1:<br><br>";

for (let i = 0; i < 5; i++) {
  text += Math.random() + "<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
