<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Date Set Methods</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>The setMonth() and setDate() Methods</h4>
<p id="demo"></p>

<script>
// Set to March (month 2)
const d1 = new Date();
d1.setMonth(2);

// Set to day 15
const d2 = new Date();
d2.setDate(15);

document.getElementById("demo").innerHTML =
  "setMonth(2) - March: " + d1 + "<br>" +
  "setDate(15): " + d2;
</script>

</body>
</html>
