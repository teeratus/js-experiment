<!DOCTYPE html>

<h2>JavaScript Date Set Methods</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>The setFullYear() Method</h4>
<p id="demo"></p>

<script>
const d = new Date();
d.setFullYear(2020);

document.getElementById("demo").innerHTML =
  "After setFullYear(2020):<br>" + d;
</script>
