<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Type Coercion</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Best Practices to Avoid Bugs</h4>
<p id="demo"></p>

<script>
let text = "";

// Use === (Strict Equality)
text += "5 == \"5\" : " + (5 == "5") + "<br>";
text += "5 === \"5\" : " + (5 === "5") + "<br><br>";

// Be Explicit
text += "Number(\"5\") + 2 : " + (Number("5") + 2) + "<br><br>";

// Watch for NaN
let result = "abc" - 1;
text += "\"abc\" - 1 : " + result;

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
