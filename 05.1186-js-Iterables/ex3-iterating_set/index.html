<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Iterables</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Iterating Over a Set</h4>
<p id="demo"></p>

<script>
const letters = new Set(["a", "b", "c"]);
let text = "";

for (let letter of letters) {
  text += letter + " ";
}

document.getElementById("demo").innerHTML =
  "Set: a, b, c<br>" +
  "Iterated: " + text;
</script>

</body>
</html>
