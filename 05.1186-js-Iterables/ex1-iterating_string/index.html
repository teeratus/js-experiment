<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Iterables</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Iterating Over a String</h4>
<p id="demo"></p>

<script>
const word = "Hello";
let text = "";

for (let char of word) {
  text += char + " ";
}

document.getElementById("demo").innerHTML =
  "String: " + word + "<br>" +
  "Characters: " + text;
</script>

</body>
</html>
