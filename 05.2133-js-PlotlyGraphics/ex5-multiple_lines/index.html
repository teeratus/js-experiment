<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Plotly Graphics</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Multiple Lines</h4>

<div id="multiLineChart"></div>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<script>
const trace1 = {
  x: [1, 2, 3, 4, 5, 6, 7, 8],
  y: [10, 12, 15, 14, 18, 20, 22, 25],
  mode: 'lines+markers',
  name: 'Series 1',
  line: {color: '#4CAF50', width: 3}
};

const trace2 = {
  x: [1, 2, 3, 4, 5, 6, 7, 8],
  y: [5, 8, 7, 11, 9, 13, 12, 16],
  mode: 'lines+markers',
  name: 'Series 2',
  line: {color: '#F44336', width: 3, dash: 'dash'}
};

const trace3 = {
  x: [1, 2, 3, 4, 5, 6, 7, 8],
  y: [3, 5, 4, 7, 6, 9, 8, 11],
  mode: 'lines+markers',
  name: 'Series 3',
  line: {color: '#2196F3', width: 3, dash: 'dot'}
};

const data = [trace1, trace2, trace3];

const layout = {
  title: 'Multiple Line Graphs',
  xaxis: {title: 'Time'},
  yaxis: {title: 'Values'}
};

Plotly.newPlot('multiLineChart', data, layout);
</script>

</body>
</html>
