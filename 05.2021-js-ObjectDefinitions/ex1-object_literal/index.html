<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Object Definitions</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Using an Object Literal</h4>
<p id="demo"></p>

<script>
const person = {
  firstName: "John",
  lastName: "Doe",
  age: 30,
  eyeColor: "blue"
};

document.getElementById("demo").innerHTML =
  person.firstName + " " + person.lastName + ", age " + person.age;
</script>

</body>
</html>
