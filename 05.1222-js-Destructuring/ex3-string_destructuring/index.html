<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Destructuring</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>String Destructuring</h4>
<p id="demo"></p>

<script>
// Create a String
let name = "W3Schools";

// Destructuring
let [a1, a2, a3, a4, a5] = name;

document.getElementById("demo").innerHTML =
  a1 + " " + a2 + " " + a3 + " " + a4 + " " + a5;
</script>

</body>
</html>
