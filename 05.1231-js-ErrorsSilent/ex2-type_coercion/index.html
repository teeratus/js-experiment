<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Silent Errors</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Type Coercion</h4>
<p id="demo"></p>

<script>
let result1 = ('5' + '2'); // = 52 (concatenation)
let result2 = ('5' - '2'); // = 3  (numeric subtraction)

document.getElementById("demo").innerHTML =
  "('5' + '2') = " + result1 + "<br>" +
  "('5' - '2') = " + result2;
</script>

</body>
</html>
