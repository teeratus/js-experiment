<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Timers</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>The setInterval() Function</h4>
<p id="demo"></p>

<script>
let counter = 0;
setInterval(function() {
  counter++;
  document.getElementById("demo").innerHTML = "Counter: " + counter;
}, 1000);
</script>

</body>
</html>
