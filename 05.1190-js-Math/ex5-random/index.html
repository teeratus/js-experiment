<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Math</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Math.random()</h4>
<p id="demo"></p>

<script>
let text = "Random numbers:<br><br>";

for (let i = 0; i < 3; i++) {
  text += Math.random() + "<br>";
}

text += "<br>Random integer 1-10: " + 
  Math.floor(Math.random() * 10) + 1;

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
