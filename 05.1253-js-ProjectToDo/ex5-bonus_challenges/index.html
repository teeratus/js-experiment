<!DOCTYPE html>
<html>
<head>
<style>
:root {
  --primary-color: #4f46e5;
  --primary-hover: #4338ca;
  --bg-color: #f8fafc;
  --card-bg: #ffffff;
  --text-color: #1e293b;
  --text-secondary: #64748b;
  --border-color: #e2e8f0;
  --danger-color: #ef4444;
  --danger-hover: #dc2626;
  --success-color: #22c55e;
  --success-hover: #16a34a;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
}

.container {
  background-color: var(--card-bg);
  padding: 32px;
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 480px;
}

h2 {
  margin-top: 0;
  font-size: 24px;
  font-weight: 700;
  color: #1e1b4b;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 24px;
}

.input-group {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

input[type="text"] {
  flex-grow: 1;
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.2s;
  outline: none;
}

input[type="text"]:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

button {
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  padding: 12px 16px;
  border: none;
  transition: all 0.2s;
}

.btn-primary {
  background-color: var(--primary-color);
  color: white;
}

.btn-primary:hover {
  background-color: var(--primary-hover);
}

.btn-danger {
  background-color: var(--border-color);
  color: var(--text-color);
}

.btn-danger:hover {
  background-color: var(--danger-color);
  color: white;
}

.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.filter-btn {
  background: none;
  color: var(--text-secondary);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}

.filter-btn:hover {
  background-color: #f1f5f9;
  color: var(--text-color);
}

.filter-btn.active {
  background-color: #e0e7ff;
  color: var(--primary-color);
}

.sort-container {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 12px;
}

.sort-btn {
  background: none;
  color: var(--text-secondary);
  font-size: 12px;
  padding: 4px 8px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
}

.sort-btn:hover {
  background-color: #f8fafc;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0 0 24px 0;
  max-height: 300px;
  overflow-y: auto;
}

li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-color);
  transition: background-color 0.2s;
}

li:hover {
  background-color: #fafafa;
}

li.done .task-text {
  text-decoration: line-through;
  color: var(--text-secondary);
}

.task-checkbox {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--primary-color);
}

.task-text {
  flex-grow: 1;
  font-size: 14px;
  word-break: break-all;
}

.task-edit-input {
  flex-grow: 1;
  padding: 8px;
  border: 1px solid var(--primary-color);
  border-radius: 4px;
  font-size: 14px;
}

.actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  background: none;
  padding: 6px;
  color: var(--text-secondary);
  border-radius: 4px;
}

.action-btn:hover {
  background-color: #e2e8f0;
  color: var(--text-color);
}

.action-btn.delete:hover {
  color: var(--danger-color);
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background-color: #1e293b;
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  box-shadow: var(--shadow);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

#toast.show {
  opacity: 1;
}
</style>
</head>
<body>

<div class="container">
  <h2>To-Do List</h2>
  <p class="subtitle">From w3schools.com, Experiment by Teeratus_R</p>

  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <button class="btn-primary" onclick="addTask()">Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all')">All</button>
    <button class="filter-btn" onclick="setFilter('active')">Active</button>
    <button class="filter-btn" onclick="setFilter('completed')">Completed</button>
  </div>

  <div class="sort-container">
    <button class="sort-btn" onclick="sortTasks()">Sort A-Z</button>
  </div>

  <ul id="list"></ul>

  <div class="footer">
    <span id="taskCount" style="font-size: 13px; color: var(--text-secondary);">0 items left</span>
    <button class="btn-danger" onclick="clearAll()">Clear All</button>
  </div>
</div>

<div id="toast">Saved!</div>

<script>
let tasks = [];
let currentFilter = 'all';

// Load tasks initially
loadTasks();

function saveTasks() {
  localStorage.setItem("tasks_bonus", JSON.stringify(tasks));
  showToast("Saved!");
}

function loadTasks() {
  let saved = localStorage.getItem("tasks_bonus");
  if (saved !== null) {
    tasks = JSON.parse(saved);
  } else {
    // Default tasks if empty
    tasks = [
      { text: "Learn JavaScript basics", completed: true },
      { text: "Build a To-Do App", completed: false },
      { text: "Implement LocalStorage integrations", completed: false }
    ];
  }
  displayTasks();
}

function displayTasks() {
  let listEl = document.getElementById("list");
  let html = "";
  
  let filtered = tasks.filter(task => {
    if (currentFilter === 'active') return !task.completed;
    if (currentFilter === 'completed') return task.completed;
    return true;
  });

  filtered.forEach((task, index) => {
    // find actual index in master tasks array
    let masterIndex = tasks.indexOf(task);
    
    html += `<li class="${task.completed ? 'done' : ''}">`;
    html += `<input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${masterIndex})">`;
    
    if (task.isEditing) {
      html += `<input type="text" class="task-edit-input" value="${task.text}" id="edit-${masterIndex}" onkeydown="handleEditKey(event, ${masterIndex})">`;
      html += `<div class="actions">`;
      html += `<button class="action-btn" onclick="saveEdit(${masterIndex})">Save</button>`;
      html += `</div>`;
    } else {
      html += `<span class="task-text">${task.text}</span>`;
      html += `<div class="actions">`;
      html += `<button class="action-btn" onclick="startEdit(${masterIndex})">Edit</button>`;
      html += `<button class="action-btn delete" onclick="removeTask(${masterIndex})">x</button>`;
      html += `</div>`;
    }
    
    html += `</li>`;
  });

  listEl.innerHTML = html;
  
  // Update count of active tasks
  let activeCount = tasks.filter(t => !t.completed).length;
  document.getElementById("taskCount").textContent = `${activeCount} item${activeCount === 1 ? '' : 's'} left`;
}

function addTask() {
  let input = document.getElementById("taskInput");
  let text = input.value.trim();
  if (text === "") {
    alert("Please enter a valid task!");
    return;
  }
  tasks.push({ text: text, completed: false });
  input.value = "";
  saveTasks();
  displayTasks();
}

// Allow Enter key to add task
document.getElementById("taskInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    addTask();
  }
});

function removeTask(index) {
  tasks.splice(index, 1);
  saveTasks();
  displayTasks();
}

function clearAll() {
  tasks = [];
  saveTasks();
  displayTasks();
}

function toggleTask(index) {
  tasks[index].completed = !tasks[index].completed;
  saveTasks();
  displayTasks();
}

function startEdit(index) {
  tasks.forEach((t, i) => t.isEditing = (i === index));
  displayTasks();
  let input = document.getElementById(`edit-${index}`);
  if (input) {
    input.focus();
    // Put cursor at end of input
    let length = input.value.length;
    input.setSelectionRange(length, length);
  }
}

function saveEdit(index) {
  let input = document.getElementById(`edit-${index}`);
  if (input) {
    let newText = input.value.trim();
    if (newText !== "") {
      tasks[index].text = newText;
    }
  }
  tasks[index].isEditing = false;
  saveTasks();
  displayTasks();
}

function handleEditKey(event, index) {
  if (event.key === "Enter") {
    saveEdit(index);
  } else if (event.key === "Escape") {
    tasks[index].isEditing = false;
    displayTasks();
  }
}

function setFilter(filter) {
  currentFilter = filter;
  // Update UI active buttons
  let buttons = document.querySelectorAll(".filter-btn");
  buttons.forEach(btn => {
    btn.classList.remove("active");
    if (btn.textContent.toLowerCase() === filter) {
      btn.classList.add("active");
    }
  });
  displayTasks();
}

function sortTasks() {
  tasks.sort((a, b) => a.text.localeCompare(b.text));
  saveTasks();
  displayTasks();
}

function showToast(text) {
  let toast = document.getElementById("toast");
  toast.textContent = text;
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
  }, 2000);
}
</script>

</body>
</html>
