<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Async/Await</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>The async Keyword</h4>
<p id="demo"></p>

<script>
async function myFunction() {
  return "Hello";
}

myFunction().then(function(value) {
  document.getElementById("demo").innerHTML = value;
});
</script>

</body>
</html>
