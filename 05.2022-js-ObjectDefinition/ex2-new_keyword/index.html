<!DOCTYPE html>

<h2>JavaScript Object Definition</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Using the new Keyword</h4>
<p id="demo"></p>

<script>
const person = new Object();
person.firstName = "John";
person.lastName = "Doe";
person.age = 30;

</script>
