<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Class Static</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Static Class Methods</h4>
<p id="demo"></p>

<script>
class Car {
  constructor(name) {
    this.name = name;
  }
  static hello() {
    return "Hello!";
  }
}

document.getElementById("demo").innerHTML = Car.hello();
</script>

</body>
</html>
