<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Set Methods</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>The add() Method</h4>
<p id="demo"></p>

<script>
const letters = new Set();

// Chained add() calls
letters.add("a").add("b").add("c").add("d");

document.getElementById("demo").innerHTML =
  "Set: " + [...letters] + "<br>" +
  "size: " + letters.size;
</script>

</body>
</html>
