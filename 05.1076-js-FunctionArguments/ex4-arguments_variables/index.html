<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Function Arguments</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Arguments Can Be Variables</h4>
<p id="demo"></p>

<script>
function add(x, y) {
  return x + y;
}
let a = 10;
let b = 25;
document.getElementById("demo").innerHTML = a + " + " + b + " = " + add(a, b);
</script>

</body>
</html>
