<h2>JavaScript IIFE</h2>

<h4>IIFE with Return Value</h4>
<p id="demo"></p>

<script>
let result = (function() {
  let x = 5;
  let y = 10;
  return x * y;
})();

document.getElementById("demo").innerHTML = "Result: " + result;
</script>
