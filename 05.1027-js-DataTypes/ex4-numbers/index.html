<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Data Types</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>JavaScript Numbers</h4>
<p id="demo1"></p>
<p id="demo2"></p>

<script>
let x1 = 34.00;
let x2 = 34;
let x3 = 3.14;

document.getElementById("demo1").innerHTML =
  "x1 = " + x1 + "<br>" +
  "x2 = " + x2 + "<br>" +
  "x3 = " + x3;

let y1 = 123e5;
let y2 = 123e-5;
document.getElementById("demo2").innerHTML =
  "123e5 = " + y1 + "<br>" +
  "123e-5 = " + y2;
</script>

</body>
</html>
