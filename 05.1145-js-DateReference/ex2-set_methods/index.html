<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Date Reference</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Date Set Methods</h4>
<p id="demo"></p>

<script>
const d = new Date();
d.setFullYear(2024);
d.setMonth(5);
d.setDate(15);
d.setHours(12);
d.setMinutes(30);
d.setSeconds(45);

document.getElementById("demo").innerHTML = "After using set methods:<br>" + d;
</script>

</body>
</html>
