<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Code Blocks</h2>
<p>From w3schools.com, Experiment by Teeratus_R</p>

<h4>Code Blocks and Statements</h4>
<p id="demo"></p>

<script>
// A code block groups statements together
{
  let x = 5;
  let y = 10;
  let result = x + y;
  document.getElementById("demo").innerHTML =
    "x = " + x + "<br>" +
    "y = " + y + "<br>" +
    "x + y = " + result;
}
</script>

</body>
</html>
